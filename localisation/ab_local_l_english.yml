l_english:
 ab_bulgaria.1.t: "Fall of Constantinople"
 ab_bulgaria.1.d: "The stench of death fills the air and the Golden Horn runs red with blood. As the walls of Constantinople shattered beneath the blows of our war machines, our men poured forth, engulfing the desperate garrisons. The ensuing bloodshed soon consumed the entire city. At some point, our Shtitonostzi broke free from their ranks to pursue a burgeoning melee in the Sacred Palace, the abandoned home of Constantine I himself. The decrepit building soon found itself alight, be it by sabotage or circumstance and the resulting flames consumed half of the city, as if Constantine's sadness and subsequent malice had rained down from the heavens to punish his decadent descendants. Miraculously, the Hagia Sophia was unharmed, despite its adjacency to the Sacred Palace. Not only has the garrison been wholly annihilated, but so has the city's approximate population of 50,000 assorted Greeks. Thousands have fled and many more have been slain. With the city's administrative and noble population thoroughly destroyed, Boyar men and scores of Bulgar peasants have swept through the streets, claiming property and new governmental positions alike, thoroughly and irreversibly changing the city's demographics. Given the newfound proliferation of the Bulgar tongue in and around the city, as well as along the freshly-secured trade routes, Constantinople has been unofficially and colloquially branded with a new name, far-removed from the language prior - Tsarigrad."
 ab_bulgaria.1.a: "Long live the Tsar!"
 ab_bulgaria.2.t: "Unification of the Southern Slavs"
 ab_bulgaria.2.d: "For centuries, the Slavic world, especially its southernmost extent, has been at the behest of foreign powers, particularly the Byzantines. Outsiders have historically run diplomatic and technological circles around our humble kingdoms, picking at our traditions, native faiths and ways of life until we were mere cannibalized shells of peoples; bullied diplomatically and economically in order to ward off our 'primitive wrath' and gradually changed into new cultures and countries entirely, swallowed up and integrated into the Orthodox world. This need not be grim, however. We were always a mighty and cunning people. We might have been behind the times and outmatched technologically, but this is true no longer. The Southern Slavs now find themselves united beneath a common banner. Free from the oppressive outsiders, our burgeoning empire finds newfound respect in the eyes of its neighbors. At long last, from the most humble of peasants to the most divine of kings, all recognise the united cultural hegemony we have pursued."
 ab_bulgaria.2.a: "Slava Rodu!"
 ab_bulgaria.3.t: "The Third Rome"
 ab_bulgaria.3.d: "The Roman Empire has faded into the past. Sorry kingdoms, bumbling rump states and charlatan conquerors have tried and failed to claim the title of Rome for themselves. All over Europe, one never ceases to encounter claimants. To one's horror, the number of claimants seems to correspond well with the justification and quality of the claims themselves; never has it been more true that the more there is of something, the less value it holds. However - one claim shines in a sea of the lost and embittered. One claim stands tall, towering over the ancient forests of Eastern Europe, looming over every petty lord's palace and humble hillfort. From our bustling and proud capital, a song is sung - that of a new Rome, a Third Rome, a Rome triumphant and reborn. A Rome of Christ, an Orthodox and true Christ at that, seeking to unify, envelop and protect the Orthodox world in its totality. In the name of all Bulgars, all Slavs and all true and tried Christians, we proclaim Rome reborn - with us at its helm."
 ab_bulgaria.3.a: "Forevermore Rome"
 ab_bulgaria.4.t: "Appointment of a Kavkhan"
 ab_bulgaria.4.d: "Dating back to the days of Kubrat Khan and the founding of Old Great Bulgaria, our [Root.Monarch.GetTitle] is never without a Kavkhan as his right hand. From the old illustrious families of the Kavkhan Kin, to dynamic appointees of their own merit, our Kavkhan have always been the foremost advisors of our great ruler; even co-rulers when necessary. Yet, with historical duties ranging from judge, to diplomat, to commander-in-chief of our army, we need to choose the focus of the Kavkhan’s role for [Root.Monarch.GetName]’s reign."
 ab_bulgaria.4.a: "In the mould of Isbul, an administrator and builder of great works."
 ab_bulgaria.4.b: "We shall follow the example of Peter, sending diplomatic missions far and wide."
 ab_bulgaria.4.c: "A new Georgi shall lead our armies!"
 # Ideas #
 BUL2_ideas: "Bulgarian Ideas"
 BUL2_ideas_start: "Bulgarian Traditions"
 BUL2_ideas_bonus: "Bulgarian Ambition"
 bul_first: "Confirm the Boyar Rights"
 bul_first_desc: "The Boyars- divided into 'veliki' and 'malki', meaning 'great' and 'minor' respectively- are the highest ranking men of the nobility. They are land-owners, possessors of serfs and most often have roles in the military or administration. Given this, we can selectively grant the title of Boyar to those we deem worthy and thus not only foster loyalty in their ranks, but foster efficiency in our government, too."
 bul_second: "Reform the Shtitonostzi"
 bul_second_desc: "The Shtitonostzi, warriors of our proud tradition of spear-based combat, stand as the perfect defence against vicious cavalry onslaughts, which we have grown apt towards encountering. Perfecting our fortitude against the steppe rider and the armoured knight alike gives our armies an impeccable advantage."
 bul_third: "Proclaim the Third Empire"
 bul_third_desc: "Having risen above the combined wrath of our neighbours, nothing stands in our way. With our eager Boyars, ferocious men and apt scholars, we may still forge an empire from our burgeoning holdings- the Third Empire of the Bulgarians, greater than those that have come before, encompassing all of the Balkans and more."
 bul_fourth: "Bulgarian Golden Age"
 bul_fourth_desc: "Under Simeon I the Great, the Bulgarian realm saw spectacular growth. Not only was our territory and political prowess significantly expanded, but our people also saw beautiful advances in literature, arts, architecture and language. Even the Byzantine Empire came to recognise our imperial title. Now, we stand on the precipice of a golden age many times greater- and not simply the submission of Byzantium, but also its utter annihilation."
 bul_fifth: "Utilise the Shock Tactics"
 bul_fifth_desc: "The Bulgar army- primarily consisting of formidable heavy cavalry- has been so feared by our neighbours that even Byzantine generals have quivered at its approach and commanded retreats. Not only are our cavalrymen adorned with a plethora of armour, but also the utmost wisdom in strategy. It is said our riders 'can see in the dark, like little bats', utilising the cover of night, feigned retreats and expert defensive positioning to shred the enemy's numbers. This prestigious nature persists to this day."
 bul_sixth: "Center of the Slavic Culture"
 bul_sixth_desc: "Given our enduring strength, stability and centralisation, not only have Bulgarian scholars found our empire to be an oasis of thought in a sea of chaos, but so have monks and thinkers of the greater Slavic world. With their combined efforts and freedom from oppression and violence, thinkers of the entire region empower not only themselves, but our empire too, enabling administrative and militaristic advancement ahead of our ailing neighbours."
 bul_seventh: "The Three Seas"
 bul_seventh_desc: "Bulgaria sets within the region of Eastern Europe, which could be described as a land sat between three seas- the Adriatic, the Baltic and the Black Sea. Given this, we have a commonality with all countries who also sit between the Three Seas- a desire to be free from external oppression, external threats and external opposition. Let us become a hegemon not only of the Balkans, but also the Three Seas themselves, engulfing, absorbing and protecting all within the region."

 ILR_ideas: "Illyrian Ideas"
 ILR_ideas_start: "Illyrian Traditions"
 ILR_ideas_bonus: "Illyrian Ambition"
 ilr_first: "Illyrian Assembly"
 ilr_first_desc: "The National Assembly of Illyria is the unicameral parliament and legislative body of our great nation. This allows us to quickly and efficiently help our people with whatever problems they may have."
 ilr_second: "Blood Before Faith"
 ilr_second_desc: "Your Faith is of no importance! The one thing that truly matters is the blood coursing through your veins, the blood that fills your heart with courage and righteousness. Faith should not and will not divide us! Long live Illyria!"
 ilr_third: "South Slavic Union"
 ilr_third_desc: "Our country is truly magical! Bulgars, Croats, Bosnians, Serbs and Slovenes all worked together, helping each other, instead of fighting! They see each other on the street, they greet each other, and while they may not fully understand one another, they create such a bond that few other cultures can achieve."
 ilr_fourth: "Establish Banovinas"
 ilr_fourth_desc: "The Banovinas (Banates) is the name of the administrative regions of Illyria. Officially there are 13 Banovinas, which are created to look after and help the many peoples of our nation."
 ilr_fifth: "Royal Illyrian Army"
 ilr_fifth_desc: "The Royal Illyrian Army is something to behold. The Bulgar light cavalry worked under the Alemannic Guard, the Hajduks and Pandurs under the militarily flexible Bulgar generals. Our forces are so synchronised, because after years of being together, even if they speak different languages, they can completely understand each other and pass down orders and information with great ease."
 ilr_sixth: "Expand the Estates"
 ilr_sixth_desc: "There are many estates in our country - the prosperous traders of Croatia, the noble boyars of Bulgaria, the righteous clergy of Serbia, the strong nobles of Carniola and many, many others. And amazingly, even though they are different and very numerous, they manage to find a common purpose - to help the country and the people of Illyria, and for their unwavering loyalty and generousness, we are forever grateful."
 ilr_seventh: "Hej, Sloveni!"
 ilr_seventh_desc: "Hej Sloveni, jošte živi,\nDuh naših djedova,\nDok za narod srce bije\nNjihovih sinova.\n \nŽivi, živi duh slovenski\nŽivjece vjekov'ma\nZalud prijeti ponor pakla\nZalud vatra groma.\n \nNek se sada i nad nama\nBurom sve raznese,\nStijena puca, dub se lama,\nZemlja nek se trese.\n \nMi stojimo postrojano\nKano klisurine,\nProklet bio izdajica\nSvoje domovine."

# Reforms #
 bultsardom: "Bulgarian Tsardom"
 bultsardom_desc: "Bulgaria is well accustomed to the prestigious title of Tsardom - ever since Simeon the Great first proclaimed himself 'Emperor of Bulgarians and Greeks', bulgarianizing the roman title of Caesar into Tsesar, or later Tsar, Bulgaria has hailed every single one of the rulers after him as Tsars no matter the state or size of our country at the time. When the brothers Asen revolted against the Romans to our south in 1185, it was only logical that they continue the legacy of the First Empire - this title grants prestige, good cause for continued attacks on the Romans, and a place on the world stage far above any of our South Slavic neighbours."
 bulliterary: "New Literary School"
 bulliterary_desc: "The cultural Golden Age that lasted throughout Simeon the Great's reign was made possible because of his hospitality towards the many scholars and men of sciences that passed through the vast territories of Bulgaria at the time, some of which stayed and continued to pour their wisdom into the nation. Of course, we needed to preserve this knowledge so that it may be saved from the destructive sands of time. What the Tsar did was as such- he poured a considerable sum of money into building Literary Schools that would be used to house scholarly works and also be a place where commoners could go and get an introduction/education of the various sciences of the time. We would be wise to start the construction of the same types of schools so that our ever-growing population can hopefully learn from them and eventually push Bulgaria into another Golden Age. "
 bulkavkhan: "Reintroduce the Kavkhan"
 bulkavkhan_desc: "In the First Bulgarian Empire,  Kavkhan was a title that was given to the right hand of the Khan (Before Boris I converted Bulgaria to Christianity) and the Tsars - they would have a number of responsibilities and concentrated huge power and authority. The title was hereditary, a prominent boyar family would be picked generation after generation, and it was for life. The Kavkhan was also the commander-in-chief of the Bulgarian Army and one of the primary diplomats of the country. Kavkhans were often regents or even co-rulers. Interestingly enough the Asen dynasty have not yet brought the title back into the Empire, regardless of the strength and stability that a loyal boyar in such a position would give."
 bulreform: "Reform the Government"
 bulreform_desc: "Some reforms are necessary so that we can reduce the administrative strain on our nation from conquered territories. We should follow the example of the Western centralised states such as the Franks and also try to streamline the process of integration, paperwork, conversion, tax collection, and army conscription. If we can achieve the tasks we have put out for ourselves, we will see great benefits as a result of our work."
 bulsiege: "Roaring Cannons"
 bulsiege_desc: "Bulgaria learned first hand through the brutal siege of Tsarigrad the importance of swift and decisive sieges. Additionally the benefits of artillery in battle are undeniable. Perhaps a focus on good artillery pieces will not only make for faster conquests, but cheaper conquests overall."
 bulboyar: "Boyar Representation"
 bulboyar_desc: "Boyar representation was an achievement of the First Bulgarian Empire through the use of a Boyar Council, which stood as an executive body that also offered plans of action to the Tsar and through the influence of the powerful Boyar class, give the means and resources to put such plans into action. Reintroducing such a body will first off, help the Bulgarian nobility and the Tsar find fast solutions to problems and unite to remove them, and second off, it will satisfy the nobles on their demand for representation in the administration of the realm. The Counsel may be a bit awkward at first regarding its dealings, but as soon as the task, the meaning, and purpose of the Council are understood by all participants, it will be a good guiding hand that will lead and shield Bulgaria from the problems it may run into. "
 bulcumans: "Cuman Mercenaries"
 bulcumans_desc: "Where would we be without our valiant brothers-in-arms, the Cumans? They have been helping us ever since Bulgaria came back on the stage of Europe. They trick, pounce and kill our prideful enemies, who are always dumb enough the blindly charge at a smaller force regardless of how many times they get taught a lesson. Frankly, the Cumans will always be useful to us, so we best make sure that we keep our good relations with them."
 mechanic_bul_coruler_yes: "Select a §YKavhan§! as your co-ruler on monarch death. They will provide your ruler with the fourth personality trait at half efficiency."
 just_kavhan: "Just Kavhan"
 righteous_kavhan: "Righteous Kavhan"
 wellconnected_kavhan: "Well-Connected Kavhan"
 calm_kavhan: "Calm Kavhan"
 midas_kavhan: "Midas-Touched Kavhan"
