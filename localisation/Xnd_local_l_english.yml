 XFR_1:0 "Fusion of Crowns"
 XFR_1_desc:0 "The union of the French and English crowns has brought immense wealth and centralization. A more efficient tax system and reduced resistance to wartime levies reflect our combined bureaucratic might."
 XFR_2:0 "Legacy of Agincourt"
 XFR_2_desc:0 "Drawing from centuries of martial tradition, our armies stand proud and resolute. The valor of English knights and French chevaliers inspires unmatched morale on the battlefield."
 XFR_3:0 "Order Through Unity"
 XFR_3_desc:0 "The integration of two great nations under a single banner demands order. Our subjects may grumble, but the firm hand of reform brings stability and progress to all corners of the realm."
 XFR_4:0 "Colonial Supremacy"
 XFR_4_desc:0 "With combined colonial ambitions and hardened officers, the Dual Monarchy excels in overseas expansion. Native uprisings are crushed swiftly, and our generals carry forward a rich military tradition."
 XFR_5:0 "Administrative Overhaul"
 XFR_5_desc:0 "By streamlining governance across our vast domains, we reduce the cost of integrating new lands. An absolutist state begins to emerge, firm in its resolve and unyielding in purpose."
 XFR_6:0 "Professional Armies"
 XFR_6_desc:0 "Our forces are no longer mere levies but disciplined, professional soldiers. Whether in France or England, our armies are the embodiment of strength, coordination, and lethal efficiency."
 XFR_7:0 "Fortress of the Realm"
 XFR_7_desc:0 "With two homelands to defend, we have fortified our lands like never before. Sieges against our bastions are slow and costly, as defenders strike back with ruthless precision."
