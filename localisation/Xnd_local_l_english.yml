 carthaginian_1:0 "Numidian Skirmish Cavalry"
 carthaginian_1DESCR:0 "Renowned for their speed and agility, these Numidian horsemen specialize in hit-and-run tactics. Armed with javelins and unmatched horsemanship, they harass enemy lines relentlessly, excelling in the opening fire phase of battle."
 carthaginian_2:0 "Liby-Phoenician Mounted Skirmishers"
 carthaginian_2DESCR:0 "Blending Punic discipline with native cavalry traditions, these riders refine the art of mounted missile warfare. Their improved coordination and equipment allow for more effective volleys, disrupting enemy formations before close combat begins."
 carthaginian_3:0 "Punic Horse Archers"
 carthaginian_3DESCR:0 "Incorporating advanced archery techniques, these cavalry units deliver sustained and accurate fire from horseback. Their mobility and range make them deadly in prolonged fire engagements, wearing down enemies from a distance."
 carthaginian_4:0 "Carthaginian Caracole Cavalry"
 carthaginian_4DESCR:0 "Adopting early firearm tactics, these cavalry employ the caracole—rotating ranks to discharge pistols in sequence. This disciplined method maximizes firepower while maintaining formation, giving them a decisive advantage in the fire phase."
 carthaginian_5:0 "Sacred Band Fire Lancers"
 carthaginian_5DESCR:0 "The pinnacle of Carthaginian cavalry doctrine, these elite riders combine firearms with shock weapons to devastating effect. Their mastery of coordinated volleys and rapid follow-up charges allows them to dominate both fire and shock phases, striking with precision and force."
 kirk.1.t:0 "The Grand Campus Debate"
 kirk.1.d:0 "Convinced that eloquence, bravado, and an iron certainty in his own opinions can overcome any hostile audience, [Root.Monarch.GetName] has agreed to appear before a packed hall of jeering students, indignant professors, and pamphlet-waving malcontents. The court is divided: some expect a triumph of rhetoric, while others foresee only chaos, shouting, and flying projectiles."
 kirk.1.a:0 "Send him to dominate the debate stage."
 kirk.2.t:0 "Shots at the Speaking Tour"
 kirk.2.d:0 "What began as a theatrical clash of slogans and applause soon turned to panic. Amid the heckling, uproar, and a storm of outrage from the assembled crowd, a shot rang out. [Root.Monarch.GetName], who had strutted onto the stage with the confidence of a man certain he could out-argue the world, now lies mortally wounded. The court is left with shock, grief, and a great many unfinished arguments."
 kirk.2.a:0 "Charlie.... No..."
 XGB_idea_1:0 "Atlantic Settlers"
 XGB_idea_1_desc:0 "The people of Great Brittany have always looked westward beyond the horizon. By encouraging migration and organized colonial administration, our overseas settlements shall flourish into prosperous dominions."
 XGB_idea_2:0 "Breton Evangelism"
 XGB_idea_2_desc:0 "United under crown and faith, our missionaries travel across both Europe and the colonies to spread the true religion and strengthen loyalty to the realm."
 XGB_idea_3:0 "Knights of Armorica"
 XGB_idea_3_desc:0 "The martial traditions of Brittany remain strong within our armies. Well-trained cavalry and disciplined officers ensure that our forces strike with devastating effectiveness."
 XGB_idea_4:0 "Imperial Dominions"
 XGB_idea_4_desc:0 "Our overseas subjects enjoy broad autonomy under the protection of the crown. In return, they contribute men and resources willingly to the defense of the empire."
 XGB_idea_5:0 "Royal Infrastructure"
 XGB_idea_5_desc:0 "Massive investment into roads, ports, and fortifications has improved the efficiency of construction throughout Great Brittany and its possessions."
 XGB_idea_6:0 "Breton Cavalry Tradition"
 XGB_idea_6_desc:0 "The nobles of Brittany have long favored mounted warfare. By expanding cavalry recruitment and refining battlefield tactics, our mounted troops become cheaper and more effective."
 XGB_idea_7:0 "Masters of the Western Seas"
 XGB_idea_7_desc:0 "From Brest to the Channel, our shipyards produce mighty warships capable of dominating the oceans and protecting our colonial trade routes."
 XRH_ideas:0 "Rhineland Ideas"
 XRH_ideas_start:0 "Rhineland Traditions"
 XRH_ideas_bonus:0 "Rhineland Ambition"
 XRH_idea_1:0 "Rhine Infantry Corps"
 XRH_idea_1_desc:0 "The Rhineland has long supplied Europe with disciplined and experienced soldiers. Our infantry formations are renowned for their organization and battlefield prowess."
 XRH_idea_2:0 "Centers of Learning"
 XRH_idea_2_desc:0 "The universities and merchant cities along the Rhine foster innovation, philosophy, and administration. New ideas spread rapidly throughout our realm."
 XRH_idea_3:0 "Professional Officer Corps"
 XRH_idea_3_desc:0 "Strict drilling and centralized command have transformed our military into a highly disciplined fighting force capable of standing against any rival."
 XRH_idea_4:0 "Ecclesiastical Harmony"
 XRH_idea_4_desc:0 "The Rhineland stands as a center of religious authority and unity. Cooperation between church and state strengthens both the faith and the stability of the realm."
 XRH_idea_5:0 "Industrial Expansion"
 XRH_idea_5_desc:0 "Our wealthy cities and productive craftsmen allow for rapid and efficient construction projects, from workshops to mighty fortresses."
 XRH_idea_6:0 "Levees of the Rhine"
 XRH_idea_6_desc:0 "Dense populations and prosperous urban centers enable us to raise vast armies whenever the realm is threatened."
 XRH_idea_7:0 "Prosperity of the Rhine"
 XRH_idea_7_desc:0 "Trade and industry have enriched the Rhineland for centuries. By investing in urban growth and infrastructure, we can develop our lands more efficiently."
