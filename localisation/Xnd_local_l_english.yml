 NOG_ideas:0 "Nogai Ideas"
 NOG_ideas_start:0 "Nogai Traditions"
 NOG_ideas_bonus:0 "Nogai Ambition"
 NOG_idea_1:0 "Masters of the Steppe Charge"
 NOG_idea_1_desc:0 "Our warriors are born in the saddle and raised in the art of the charge. When the moment comes, our shock assaults shatter even the most disciplined enemies."
 NOG_idea_2:0 "Tribute of the Open Steppe"
 NOG_idea_2_desc:0 "Rather than relying on settled taxation, we extract wealth through tribute and control of trade routes, ensuring a steady flow of income from those under our influence."
 NOG_idea_3:0 "Nomadic Discipline"
 NOG_idea_3_desc:0 "Though outsiders see chaos, our warriors follow strict codes of loyalty and obedience, ensuring cohesion even across the vast expanses of the steppe."
 NOG_idea_4:0 "Cavalry Supremacy"
 NOG_idea_4_desc:0 "Horses are the foundation of our strength. By maintaining vast herds and training from youth, we field cavalry forces in numbers and quality unmatched by our rivals."
 NOG_idea_5:0 "Mobile Settlements"
 NOG_idea_5_desc:0 "Our way of life does not depend on permanent structures. What we build, we build efficiently, allowing us to adapt quickly to new lands and circumstances."
 NOG_idea_6:0 "Steppe Production Networks"
 NOG_idea_6_desc:0 "Through trade, herding, and control of key routes, we maximize the productivity of our lands without the need for dense urban centers."
 NOG_idea_7:0 "Flexible Governance"
 NOG_idea_7_desc:0 "Our rule stretches across vast territories, but our decentralized and flexible system allows us to govern effectively without the burdens of rigid bureaucracy."
 NOG_ideas_start_desc:0 "The Nogai Horde thrives on mobility, raiding, and the strength of its cavalry. Wealth is taken, not grown, and our warriors strike fast and hard."
 NOG_ideas_bonus_desc:0 "No enemy can match the speed of the Nogai. Across the endless steppe, our forces move like the wind, striking where they are least expected."
 SRH_ideas:0"Sirhind Ideas"
 SRH_ideas_start:0"Sirhind Traditions"
 SRH_ideas_bonus:0"Sirhind Ambition"
 srh_reclamation_of_india:0"Reclamation of Hindustan"
 srh_reclamation_of_india_desc:0"The lands of Hindustan, fractured and contested, must be restored under firm and rightful rule. Through conquest and consolidation, we reclaim what was lost."
 srh_for_the_hindu_faith:0"Guardians of the Faithful"
 srh_for_the_hindu_faith_desc:0"Faith binds the people together. By promoting religious devotion and strengthening missionary efforts, we ensure unity and stability across our realm."
 srh_reverting_the_collapse:0"Reversing the Decline"
 srh_reverting_the_collapse_desc:0"Years of instability have strained the treasury and weakened the state. Through careful stewardship, we restore financial order and curb the excesses of inflation."
 srh_develop_india:0"Investment in the Heartland"
 srh_develop_india_desc:0"The prosperity of our realm depends on the development of its cities and countryside. By investing in infrastructure and encouraging growth, we lay the foundations of enduring strength."
 srh_traders_in_administration:0"Merchants in Governance"
 srh_traders_in_administration_desc:0"Trade is the lifeblood of our state. By incorporating experienced merchants into administration, we ensure efficiency, wealth, and a keen eye for opportunity."
 srh_canonize_cyril_methodius:0"Sanctified Traditions"
 srh_canonize_cyril_methodius_desc:0"By elevating revered traditions and spiritual authorities, we foster unity among our people and reinforce the legitimacy of our rule."
 srh_svatopluks_legacy:0"Legacy of Strong Rule"
 srh_svatopluks_legacy_desc:0"The strength of a realm lies in firm leadership and the endurance of its institutions. By embracing this legacy, we maintain control even across vast and difficult lands."
 SRH_ideas_start_desc:0"Situated at the crossroads of empires, Sirhind draws strength from its people and its control of trade and manpower, forming a resilient and resourceful state."
 SRH_ideas_bonus_desc:0"With a strengthened military core, the armies of Sirhind stand ready to defend and expand their dominion with disciplined infantry forces."
