 XPR_1:0 "Masters of the Atlantic"
 XPR_1_desc:0 "Centuries of seafaring have made our fleets swift and unrelenting. Our admirals are skilled navigators, and our sailors command the Atlantic with courage and discipline."
 XPR_2:0 "Colonial Wealth Extraction"
 XPR_2_desc:0 "From the gold of Brazil to the riches of West Africa, our empire is built on the efficient exploitation of local resources. We have mastered the art of making colonies flourish—and profit."
 XPR_3:0 "Hegemony of Trade Winds"
 XPR_3_desc:0 "Controlling the seas means controlling the markets. Portuguese influence spans trade nodes and ports alike, dominating commerce wherever our banners fly."
 XPR_4:0 "Engine of Expansion"
 XPR_4_desc:0 "New settlers sail daily from Lisbon to the far corners of the world. Our colonial machine is unmatched in scope and speed, securing territory before others can plant their flags."
 XPR_5:0 "Maritime Mercantilism"
 XPR_5_desc:0 "Our merchants are backed by an imperial navy and a centralized trade network. Through a combination of power and policy, we extract maximum value from every voyage."
 XPR_6:0 "Imperial Restructuring"
 XPR_6_desc:0 "The growth of our realm demands strong administration. Reforms reduce construction costs and empower the crown, forging a centralized empire with absolute authority."
 XPR_7:0 "Fortress Colonies"
 XPR_7_desc:0 "Our holdings are well-defended outposts, bristling with artillery and prepared for any threat. In the jungles of Brazil or the deserts of Africa, our enemies will find only steel and fire."
 XCT_Ideas:0 "Carthaginian Ideas"
 XCT_Ideas_start:0 "Carthaginian Traditions"
 XCT_Ideas_bonus:0 "Carthaginian Ambition"
 XCT_1:0 "Punic Cavalry Legacy"
 XCT_1_desc:0 "The Numidian horsemen and Punic cavalry once struck fear across the Mediterranean. We continue that tradition with a mounted force renowned for its speed, strength, and dominance on open terrain."
 XCT_2:0 "Mercenary Raiding Tactics"
 XCT_2_desc:0 "Carthage has long relied on mercenaries and cost-effective warfare. Our ability to field elite cavalry at reduced cost keeps our armies agile and deadly."
 XCT_3:0 "Sailors of the Sun"
 XCT_3_desc:0 "Our people are born to the sea. From the Tyrrhenian to the Pillars of Hercules, Carthaginian sailors fill our ports, man our galleys, and deliver fire and fury to our enemies."
 XCT_4:0 "Thunder of the War Elephants"
 XCT_4_desc:0 "Reviving the ancient tradition of war elephants, we field towering beasts outfitted with gunpowder weaponry and elite archers. Though their bulk hinders traditional shock tactics, their sheer presence and ranged firepower leave enemy lines shattered before the charge even begins."
 XCT_5:0 "Lords of Mediterranean Trade"
 XCT_5_desc:0 "Carthage grew rich on commerce, and so shall we again. Our influence over trade routes expands across the sea, and our merchants are the lifeblood of our growing empire."
 XCT_6:0 "Spirit of Tanit and Baal"
 XCT_6_desc:0 "Our tolerant society accepts all who live under our banners. Guided by the gods of old and the piety of a new age, we maintain internal peace and spiritual vitality."
 XCTA_7:0 "Veterans of Zama"
 XCTA_7_desc:0 "Forged in the fires of ancient wars, our armies are hardened, disciplined, and ready to restore Carthaginian greatness. Every soldier is trained to fight with precision and resolve."
